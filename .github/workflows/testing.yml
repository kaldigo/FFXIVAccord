name: Build testing candidate
on:
  push:
    branches: [testing]
    tags: ['testing-v*']
  workflow_dispatch:
    inputs:
      testing_version:
        description: Optional four-part candidate version; empty runs validation only
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: testing-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  testing:
    if: github.ref == 'refs/heads/testing' || startsWith(github.ref, 'refs/tags/testing-v')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Validate testing source and version
        id: candidate
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.testing_version }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/testing
          if ($LASTEXITCODE) { throw 'Candidate source must belong to testing' }
          $candidateVersion=$env:REQUESTED_VERSION
          if ($env:SOURCE_REF.StartsWith('refs/tags/')) {
            if ($env:SOURCE_TAG -notmatch '^testing-v(\d+\.\d+\.\d+\.\d+)$') { throw 'Invalid testing tag' }
            $candidateVersion=$Matches[1]
          }
          if ($candidateVersion -and $candidateVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Invalid testing version' }
          "version=$candidateVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/build
        with:
          release-version: ${{ steps.candidate.outputs.version }}
      - name: Validate packaging boundaries
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package opt-in candidate against current stable feed
        if: steps.candidate.outputs.version != ''
        shell: pwsh
        env:
          TESTING_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          $stableFeed=Join-Path $env:RUNNER_TEMP 'stable-feed.json'
          git show origin/main:pluginmaster.json | Set-Content -LiteralPath $stableFeed -Encoding utf8
          if ($LASTEXITCODE) { throw 'Current stable feed unavailable' }
          python tools/package_testing.py --tag "testing-v$env:TESTING_VERSION" --stable-feed $stableFeed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_testing_package.py --tag "testing-v$env:TESTING_VERSION" --stable-feed $stableFeed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content artifacts/testing/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: steps.candidate.outputs.version != ''
        with:
          name: testing-candidate-${{ github.sha }}
          path: artifacts/testing/
          if-no-files-found: error
      - name: Publish explicitly tagged testing candidate
        if: startsWith(github.ref, 'refs/tags/testing-v')
        uses: kaldigo/DalamudPlugins/.github/actions/publish-testing@3c2396b29baf30d751ceb273708d8bfb64ee019a
        with:
          internal-name: Accord
          source-commit: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
