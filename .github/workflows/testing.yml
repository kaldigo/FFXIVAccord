name: Build testing candidate
on:
  push:
    branches: [testing]
  workflow_dispatch:
    inputs:
      testing_version:
        description: Optional four-part candidate version; empty runs validation only
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: testing-candidate
  cancel-in-progress: true
jobs:
  testing:
    if: github.ref == 'refs/heads/testing'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/build
        with:
          release-version: ${{ inputs.testing_version }}
      - name: Validate packaging boundaries
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package opt-in candidate against current stable feed
        if: inputs.testing_version != ''
        shell: pwsh
        env:
          TESTING_VERSION: ${{ inputs.testing_version }}
        run: |
          $stableFeed=Join-Path $env:RUNNER_TEMP 'stable-feed.json'
          git show origin/main:pluginmaster.json | Set-Content -LiteralPath $stableFeed -Encoding utf8
          if ($LASTEXITCODE) { throw 'Current stable feed unavailable' }
          python tools/package_testing.py --tag "testing-v$env:TESTING_VERSION" --stable-feed $stableFeed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_testing_package.py --tag "testing-v$env:TESTING_VERSION" --stable-feed $stableFeed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content artifacts/testing/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: inputs.testing_version != ''
        with:
          name: testing-candidate-${{ github.sha }}
          path: artifacts/testing/
          if-no-files-found: error
